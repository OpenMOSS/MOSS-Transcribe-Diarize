<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="realtime.title">MOSS 实时会议转写</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/realtime.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="realtime.title">MOSS 实时会议转写</h1>
    <input
      id="sessionName"
      class="session-name"
      type="text"
      data-i18n-placeholder="realtime.sessionNamePlaceholder"
      placeholder="会议名称（可留空）"
    />
    <div class="topbar-spacer"></div>
    <div class="stats">
      <span class="stat"><span class="stat-label" data-i18n="realtime.stats.rtf">rtf</span><b id="statRtf">—</b></span>
      <span class="stat"><span class="stat-label" data-i18n="realtime.stats.lag">落后</span><b id="statLag">—</b></span>
      <span class="stat"><span class="stat-label" data-i18n="realtime.stats.gated">跳过窗</span><b id="statGated">0</b></span>
      <span class="stat"><span class="stat-label" data-i18n="realtime.stats.dropped">丢帧</span><b id="statDropped">0</b></span>
      <span class="stat"><span class="stat-label" data-i18n="realtime.stats.elapsed">已录</span><b id="statClock">00:00</b></span>
    </div>
    <span id="statePill" class="pill" data-i18n="realtime.status.idle">待机</span>
    <span id="runtime" class="pill" data-i18n="realtime.runtime.checking">检测中</span>
    <select
      id="localeSelect"
      class="locale-select"
      data-i18n-aria-label="locale.label"
      data-i18n-title="locale.label"
      aria-label="界面语言"
      title="界面语言"
    >
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <section class="controls">
    <button id="startButton" class="primary" data-i18n="realtime.controls.start">开始</button>
    <button id="pauseButton" class="ghost" data-i18n="realtime.controls.pause">暂停</button>
    <button id="stopButton" class="ghost danger" data-i18n="realtime.controls.stop">停止</button>
    <span class="divider"></span>
    <button id="micButton" class="source" data-i18n="realtime.sources.microphone">麦克风</button>
    <span id="micMeter" class="meter" data-i18n-aria-label="realtime.sources.level" aria-label="电平"></span>
    <span id="micInfo" class="meta mic-info"></span>
    <button id="systemButton" class="source" data-i18n="realtime.sources.system">系统声</button>
    <span id="systemMeter" class="meter" data-i18n-aria-label="realtime.sources.level" aria-label="电平"></span>
    <span class="divider"></span>
    <span id="backendInfo" class="meta"></span>
    <span id="sessionId" class="meta mono"></span>
  </section>

  <p id="notice" class="notice" hidden></p>

  <main class="panes">
    <section class="pane committed-pane">
      <div class="pane-head">
        <strong data-i18n="realtime.committed.title">定稿</strong>
        <span class="meta" data-i18n="realtime.committed.hint">不跟随滚动时，滚回底部即可恢复</span>
      </div>
      <div id="committedList" class="committed-list"></div>
      <p id="committedEmpty" class="empty" data-i18n="realtime.committed.empty">还没有定稿内容。</p>
    </section>

    <section class="pane provisional-pane">
      <div class="pane-head">
        <strong data-i18n="realtime.provisional.title">临时</strong>
        <span class="meta" data-i18n="realtime.provisional.hint">每次推理整体替换</span>
      </div>
      <div id="provisionalList" class="provisional-list"></div>
      <p id="provisionalEmpty" class="empty" data-i18n="realtime.provisional.empty">暂时没有临时内容。</p>
    </section>
  </main>

  <footer class="bottombar">
    <div id="exportBar" class="export-bar" hidden>
      <span class="meta" data-i18n="realtime.export.title">导出</span>
      <button class="ghost" data-export="md" data-i18n="realtime.export.markdown">Markdown</button>
      <button class="ghost" data-export="srt" data-i18n="realtime.export.srt">SRT</button>
      <button class="ghost" data-export="json" data-i18n="realtime.export.json">JSON</button>
      <button class="ghost" data-export="txt" data-i18n="realtime.export.text">TXT</button>
      <button class="ghost" data-export="ass" data-i18n="realtime.export.ass">ASS</button>
      <span class="divider"></span>
      <button id="retranscribeButton" class="ghost" data-i18n="realtime.actions.retranscribe">重跑本次会话</button>
    </div>
    <div class="topbar-spacer"></div>
    <button id="historyButton" class="ghost" data-i18n="realtime.history.title">历史会话</button>
  </footer>

  <aside id="historyPanel" class="drawer" hidden>
    <div class="drawer-head">
      <strong data-i18n="realtime.history.title">历史会话</strong>
      <button id="historyClose" class="ghost small" data-i18n="realtime.actions.close">关闭</button>
    </div>
    <div id="historyList" class="drawer-body"></div>
  </aside>

  <aside id="retranscribePanel" class="drawer wide" hidden>
    <div class="drawer-head">
      <strong data-i18n="realtime.retranscribe.title">重跑结果</strong>
      <button id="retranscribeClose" class="ghost small" data-i18n="realtime.actions.close">关闭</button>
    </div>
    <pre id="retranscribeText" class="drawer-body mono"></pre>
  </aside>

  <script type="module" src="assets/realtime.js"></script>
</body>
</html>
