[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-transcribe-diarize"
version = "0.1.0"
description = "MOSS-Transcribe-Diarize inference code and Transformers remote-code model implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OpenMOSS Team" }]
dependencies = [
  "transformers>=5.6.0,<6.0.0",
  "safetensors>=0.6.2",
  "numpy>=1.26,<3",
  "av>=14.0",
  "librosa>=0.11.0",
  "numba>=0.61.0",
  "soundfile>=0.12",
  "soxr>=0.5",
  "packaging",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
mtd-subtitle = "moss_transcribe_diarize.app.cli:main"
mtd-subtitle-web = "moss_transcribe_diarize.app.web_cli:main"
mtd-realtime = "moss_transcribe_diarize.app.realtime_cli:main"

[project.optional-dependencies]
torch-runtime = [
  "torch>=2.8",
  "torchaudio>=2.8",
]
flash-attn = ["flash-attn"]
dev = ["pytest"]
# 跨窗口说话人一致所需的声纹嵌入，加服务端跑 WebSocket 要用的 websockets。
# 前两个都不依赖 torch，且只在真正构造 OnnxCampplusEmbedder 时才被 import，所以
# 不装它们也能 `import moss_transcribe_diarize.realtime`——说话人退化为模型给的
# 窗口局部标签。只做离线声纹（不用实时服务）的人可以只装前两个。
realtime = [
  "onnxruntime",
  "kaldi-native-fbank",
  "websockets",
]

[tool.setuptools.packages.find]
include = ["moss_transcribe_diarize*"]

[tool.setuptools.package-data]
"moss_transcribe_diarize.app" = ["static/*", "static/locales/*.json"]
